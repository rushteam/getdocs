<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}}</title>
{{if .Alternate}}<link rel="alternate" type="text/markdown" href="{{.Alternate}}">{{end}}
<link rel="help" href="/ai" title="AI 与开发者接入">
<link rel="stylesheet" href="/static/app.css?v={{.StaticVer}}">
<link rel="stylesheet" href="/static/chroma.css?v={{.StaticVer}}">
<script src="/static/theme.js?v={{.StaticVer}}"></script>
</head>
<body{{if .Wide}} class="wide"{{end}}>
<header class="topbar">
  <button class="icon-btn nav-toggle" type="button" aria-label="目录" data-toggle-nav>
    <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
  </button>
  <a class="brand" href="/">
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 16 16" width="16" height="16"><path d="M4 2.5h5.5L12 5v8.5H4z M9.5 2.5V5H12 M6 8h4M6 10.5h4" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round"/></svg></span>
    <span class="site-name">{{.Site}}</span>
  </a>
  {{if .Search}}
  <form class="search-box" action="/search" method="get" role="search">
    <svg viewBox="0 0 16 16" width="16" height="16" aria-hidden="true"><circle cx="7" cy="7" r="4.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="m10.5 10.5 3 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
    <input type="search" name="q" value="{{.Query}}" placeholder="搜索文档…" autocomplete="off" aria-label="搜索文档">
    <kbd class="kbd" aria-hidden="true">/</kbd>
    {{if .Scope}}<input type="hidden" name="scope" value="{{.Scope}}">{{end}}
  </form>
  {{end}}
  <nav class="top-links">
    <a href="/ai" title="llms.txt、markdown 原文、检索 API 与 MCP">AI 接入</a>
    <a href="/status">同步状态</a>
  </nav>
  <button class="icon-btn" type="button" aria-label="切换主题" data-toggle-theme>
    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" fill="currentColor"/></svg>
  </button>
</header>
{{template "content" .Body}}
<script src="/static/app.js?v={{.StaticVer}}" defer></script>
{{if .Mermaid}}<script type="module" src="/static/mermaid.js?v={{.StaticVer}}" data-src="{{.Mermaid}}"></script>{{end}}
</body>
</html>
